
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEED AI - Video Clipping</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d18;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:22px;
  text-align:center;
  background:#111a2c;
  color:#35d5ff;
  font-size:30px;
  font-weight:bold;
}
main{
  max-width:650px;
  margin:45px auto;
  padding:20px;
}
.panel{
  background:#121d31;
  padding:25px;
  border-radius:18px;
  text-align:center;
}
input,textarea,button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border-radius:9px;
  font-size:16px;
}
input,textarea{
  background:#091323;
  color:white;
  border:1px solid #34445e;
}
button{
  background:#00bfff;
  color:#00111c;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
#result{margin-top:20px;overflow-wrap:anywhere}
</style>
</head>

<body>
<header>⚡ SPEED AI</header>

<main>
<div class="panel">
<h2>AI VIDEO CLIPPING</h2>
<p>Turn your video into amazing clips.</p>

<input type="file" id="video" accept="video/*">

<textarea id="prompt" rows="4"
placeholder="Describe the clips you want..."></textarea>

<input type="number" id="duration" value="30" min="5">

<button onclick="generateVideo()" id="btn">
GENERATE CLIPS
</button>

<div id="result"></div>
</div>
</main>

<script>
const API="https://speed-ai-clipping.onrender.com";

async function generateVideo(){
 const prompt=document.getElementById("prompt").value.trim();
 const duration=Number(document.getElementById("duration").value);
 const result=document.getElementById("result");
 const btn=document.getElementById("btn");

 if(!prompt){
   result.textContent="Please enter a prompt.";
   return;
 }

 btn.disabled=true;
 result.textContent="Sending request...";

 try{
   const response=await fetch(API+"/api/video/generate",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({prompt,duration})
   });

   const data=await response.json();
   result.textContent=data.success
     ?"Request received! Status: "+data.status
     :"Error: "+data.message;
 }catch(error){
   result.textContent="Connection error. Please try again.";
 }

 btn.disabled=false;
}
</script>
</body>
</html>
