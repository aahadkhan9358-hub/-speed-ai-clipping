
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEED AI - Smart Video Clipping</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px;text-align:center;
 background:#111a2c;color:#35d5ff;
 font-size:30px;font-weight:bold;
}
main{max-width:650px;margin:35px auto;padding:20px}
.panel{
 background:#121d31;padding:25px;
 border-radius:18px;text-align:center;
}
input,textarea,button{
 width:100%;padding:15px;margin-top:15px;
 border-radius:9px;font-size:16px;
}
input,textarea{
 background:#091323;color:white;
 border:1px solid #34445e;
}
button{
 background:#00bfff;color:#00111c;
 border:0;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.5}
#result{margin-top:20px;overflow-wrap:anywhere}
.status{color:#39e6a5}
</style>
</head>
<body>

<header>⚡ SPEED AI</header>

<main>
<div class="panel">
<h2>AI VIDEO CLIPPING</h2>
<p>Upload your video and send your clipping request.</p>

<input type="file" id="video" accept="video/*">

<button id="uploadBtn" onclick="uploadVideo()">
UPLOAD VIDEO
</button>

<textarea id="prompt" rows="4"
placeholder="Describe the clips you want..."></textarea>

<input type="number" id="duration"
value="30" min="5" placeholder="Clip duration">

<button id="generateBtn" onclick="generateVideo()">
GENERATE CLIPS
</button>

<div id="result">SPEED AI is ready.</div>
</div>
</main>

<script>
const API="https://speed-ai-clipping.onrender.com";
let uploadedFileName="";

async function uploadVideo(){
 const file=document.getElementById("video").files[0];
 const result=document.getElementById("result");
 const btn=document.getElementById("uploadBtn");

 if(!file){
  result.textContent="Please select a video.";
  return;
 }
 if(!file.type.startsWith("video/")){
  result.textContent="Please select a video file.";
  return;
 }
 if(file.size>200*1024*1024){
  result.textContent="Maximum video size is 200 MB.";
  return;
 }

 const form=new FormData();
 form.append("video",file);
 btn.disabled=true;
 result.textContent="Uploading video...";

 try{
  const response=await fetch(API+"/api/video/upload",{
   method:"POST",body:form
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.message);
  uploadedFileName=data.fileName;
  result.innerHTML='<span class="status">Video uploaded successfully!</span>';
 }catch(error){
  result.textContent="Upload failed: "+error.message;
 }finally{
  btn.disabled=false;
 }
}

async function generateVideo(){
 const prompt=document.getElementById("prompt").value.trim();
 const duration=Number(document.getElementById("duration").value);
 const result=document.getElementById("result");
 const btn=document.getElementById("generateBtn");

 if(!uploadedFileName){
  result.textContent="Upload a video first.";
  return;
 }
 if(!prompt){
  result.textContent="Enter your clipping instructions.";
  return;
 }

 btn.disabled=true;
 result.textContent="Sending request...";

 try{
  const response=await fetch(API+"/api/video/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    prompt,duration,fileName:uploadedFileName
   })
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.message);
  result.textContent="Request accepted. Status: "+data.status+
   ". Actual AI clipping is not enabled yet.";
 }catch(error){
  result.textContent="Error: "+error.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
